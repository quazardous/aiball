# Component inventory for aiball (see packages/components/).
# Drives `components list / version <key> / versions / changelog <key>`.
project: aiball

components:
  - key: aiball
    name: Aiball BAL
    file: package.json
    path: version
    extractor: json
    main: true

  - key: frontend
    name: Aiball Web UI
    file: frontend/package.json
    path: version
    extractor: json

  - key: components-tool
    name: Components CLI
    file: packages/components/package.json
    path: version
    extractor: json
