# claude-loop default ping phrases (#B.63 v1). Override per-loop via
# `claude-loop start --pings /path/to/custom.yaml`. Picked at random
# on each wake-up — the message itself is purely cosmetic; the only
# functional effect is to trigger a new claude turn.
ping_messages:
  - "What's up, Doc?"
  - "Wake up, Neo."
  - "Hello, Dave."
  - "Make it so."
  - "Allons-y!"
  - "Geronimo!"
  - "It's alive!"
  - "Anybody out there?"
  - "Beep boop."
  - "Yabba dabba doo!"
  - "*tap tap* this thing on?"
  - "Pop quiz, hotshot."
  - "I'll be in your tmux."
  - "Ping?"
  - "Resistance is futile (drain the backlog)."
  - "Live long and process tickets."
  - "Hodor."
  - "Excellent."
  - "Engage."
  - "Houston, we have an idle session."

# Wake phrases used when the SSE ping carries a concrete artifact
# (ticket id, optionally a comment hashid). Per-intent so the
# directiveness of the prompt scales with the parent ticket's intent
# (#B.198 david: "le niveau de directivité est géré en config yaml").
#
# Tokens:
#   {ticket}  → integer ticket id (e.g. `198`)
#   {comment} → comment hashid WITHOUT the leading `#` (e.g. `agpgpg`)
#
# Two slots per intent:
#   with_comment → used when both ticket and comment are known
#   ticket_only  → used when only the ticket is known (root ping)
#
# If an intent is missing from this map, claude-loop falls back to
# the `request` row. If the whole `wake_phrases` block is missing
# (e.g. a pings.yaml shipped before this section was added), the
# code uses its hardcoded defaults in state.ts.
wake_phrases:
  # #B.230 david: prompts must explicitly mention "aiball" so claude
  # doesn't confuse the ticket id with other trackers' (mantis, github
  # issues, jira…) when the project has multiple MCP-exposed trackers.
  panic:
    with_comment: "URGENT: aiball ticket #{ticket} needs you — new comment #{comment}."
    ticket_only:  "URGENT: aiball ticket #{ticket} needs you."
  request:
    with_comment: "Handle aiball ticket #{ticket} — new comment #{comment}."
    ticket_only:  "Handle aiball ticket #{ticket}."
  question:
    with_comment: "aiball ticket #{ticket} waits for your answer — comment #{comment}."
    ticket_only:  "aiball ticket #{ticket} waits for your answer."
  fyi:
    with_comment: "Heads-up on aiball ticket #{ticket} — new comment #{comment}."
    ticket_only:  "Heads-up on aiball ticket #{ticket}."

# State-CTA wake assembled by claude-loop's `buildContextPhrase` when a wake
# fires with no SSE artifact (timer heartbeat / stop-hook post turn /
# session-start). #400: the conditional logic lives in the template via a tiny
# placeholder grammar — no per-slot `if` assembly in code (david: « le système
# de prompt devrait être simple, pas du `if` partout »).
#
# A slot is one of (#400 recadré — tone + round-robin kept, david b296px):
#   string                  → fixed wording.
#   list[string]            → round-robin random pick for variety.
#   { <tone>: string|list } → per-tone bucket (hint|directive|imperative),
#                             selected by `autopoll.tone` (fallback directive),
#                             then round-robin within. Tone is a uniform
#                             SELECTION layer, NOT a per-placeholder rule.
# All the logic lives in the template via the grammar:
#   {var}          → the value (empty string when unset/empty)
#   {var:-default} → the value, or `default` when empty
#   {var:+text}    → `text` only when var is non-empty, else "" (inline condition)
# `text`/`default` may contain `{…}` and literal braces (tool-call syntax like
# `unread({pings: true})` is safe). Plural is a flat `(s)` in the template — no
# `_one/_other` slugs (that'd be a per-placeholder rule the code must remember).
#
# Vars exposed to `wake_master` (counts are "" when zero, so {count:+…} drops):
#   {culture}          random phrase from ping_messages above
#   {lead}             rendered wake_lead (for the chosen tone)
#   {ping_count}       unread aiball ping count
#   {open_count}       open ticket count
#   {actionable_count} tickets in your court (#374)
#   {head_id} {head_title}  the work-order head (#371: priority desc, then oldest)
#   {project_scope}    "`<project>`" or "your scope"
prompts:
  # Conversational lead — per-tone buckets, round-robin within each.
  wake_lead:
    directive:
      - "fyi:"
      - "heads up —"
      - "quick note:"
    hint:
      - "btw,"
      - "fyi,"
      - "just so you know,"
    imperative:
      - "**heads up**:"
      - "**ACTION**:"

  # The whole wake-CTA in one template. Each {x:+…} block renders only when x
  # is set — so pings/engage/open appear exactly when relevant, no branching in
  # code. #371: the engage block NAMES the work-order head (#{head_id}). Per-tone
  # buckets; directive is the shipped default tone.
  wake_master:
    directive:
      - "{culture} {lead}{ping_count:+ {ping_count} unread aiball ping(s) — drain via `unread({pings: true, mark_read: true})`.}{actionable_count:+ engage #{head_id} first — top of the work order — via `ticket_engage()`.}{open_count:+ ({open_count} open in {project_scope})}"
    hint:
      - "{culture} {lead}{ping_count:+ {ping_count} unread aiball ping(s) (clear with `unread({pings: true, mark_read: true})`).}{actionable_count:+ #{head_id} is top of the work order if you want to pick it up (`ticket_engage()`).}{open_count:+ ({open_count} open in {project_scope})}"
    imperative:
      - "{culture} {lead}{ping_count:+ {ping_count} unread aiball ping(s) — DRAIN now via `unread({pings: true, mark_read: true})`.}{actionable_count:+ ENGAGE #{head_id} first — top of the work order — via `ticket_engage()`.}{open_count:+ ({open_count} open in {project_scope})}"

  # #428: built-in gate messages. Rendered (tone-aware) when the gate triggers;
  # the detector fills placeholders like {count}. The triggered message is
  # prepended to the wake CTA. Override the wording per-project here without
  # touching the gate logic. (Custom `cmd` gates use their own `message`/stdout.)
  gate_unmerged_pr:
    directive: "⚠ {count} open PR(s) not merged — resolve before taking new work."
    hint: "btw, {count} open PR(s) still un-merged."
    imperative: "**STOP**: {count} open PR(s) not merged — resolve before new work."

# Ticket-text formatting patterns (#B.235). Linkifies refs like #B.123,
# #C.<hashid>, @mention in ticket bodies and comments. Lives in the same
# 3-layer override chain as `prompts:` (shipped defaults → ~/.config →
# per-project .aiball.yaml). Patterns are merged by `id`: shipped defaults
# are non-removable (the in-code fallback in `src/formatting.ts` always
# runs first); higher layers override `canonical`/`href`/`class` by reusing
# the same id, or ADD a new pattern with a fresh id.
#
# Regex is validated at load time (`new RegExp(match)`). Invalid entries
# log to stderr and are dropped; the rest of the merge proceeds.
#
# Fields per pattern:
#   id         stable identifier — same id across layers = override
#   match      ECMAScript regex source
#   canonical  visible label template; `{N}` references capture group N
#              (1-indexed). `{0}` = the whole match.
#   href       optional URL template (same `{N}` syntax). When set, the
#              label is wrapped in <a>. Captures are URL-encoded before
#              insertion to keep XSS surface narrow.
#   class      optional CSS class on the rendered element
#
# The block below mirrors the in-code defaults verbatim — listing them
# here so authors can SEE what the linkifier recognizes and tune it
# without touching the source. To override (e.g. change the canonical
# form to `[B-123]`), copy the entry into ~/.config/aiball/config.yaml
# or .aiball.yaml with the same id and edited fields.
formatting:
  patterns:
    - id: ticket
      # #160 Commit A : revert lookbehind hack — l'upstream pre-marked pass
      # substitue gh#NNN par placeholders avant marked, plus de collision.
      match: "#[Bb]?[._/-]?(\\d+)\\b"
      canonical: "#{1}"
      href: "/b/{1}"
      class: "ticket-ref"
    - id: comment
      match: "#[Cc][._/-]?([a-hjkmnp-z2-9]{4,8})\\b"
      canonical: "#C.{1}"
      href: "/b/{1}"
      class: "comment-ref"
    - id: mention
      # #535 : `>` retiré de la lookbehind (était bloqué pour éviter du nesting
      # dans `<a>@x</a>` mais ça bloquait au passage les mentions juste après
      # `<p>` du markdown rendu).
      match: "(?<![\\w@\"'/])@([a-zA-Z0-9_-]{2,64})\\b"
      canonical: "@{1}"
      class: "mention"
