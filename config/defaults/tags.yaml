# Shipped default tag catalog (#223). This is the LOWEST layer of the
# tags config chain:
#
#   dist (this file) → global ~/.config/aiball/config.yaml → per-project .aiball.yaml
#
# Inheritance is COMPOSITE — upper layers ADD tags (and may restate one to
# re-color / re-order it). Everything declared here is config-owned:
# read-only and non-deletable in the Tags admin panel (edit this file, or
# add to an upper layer, instead).
#
# On a fresh database these are also seeded as DB rows so they can be
# applied to tickets (the apply path is FK-by-id); the seed mirrors the
# definitions below, so colors stay consistent between the catalog and the
# ticket badges.
#
# Shape: a bare name, or `{ name, color?, note? }`.
tags:
  - { name: bug, color: "#ef4444", note: "something is broken" }
  - { name: feature, color: "#10b981", note: "new capability" }
  - { name: question, color: "#3b82f6", note: "needs clarification" }
  - { name: docs, color: "#8b5cf6", note: "documentation work" }
  - { name: urgent, color: "#f59e0b", note: "needs attention now" }
  - { name: ui, color: "#06b6d4", note: "user interface work" }
  - { name: "ui:phone", color: "#0891b2", note: "phone-sized layout" }
  - { name: infra, color: "#64748b", note: "hosting, deploy, runtime plumbing" }
#
# Removed on purpose: `discussion`, `wontfix` and `done` (plus the DB-only
# `todo` and `smartphone`). Three of them named a ticket's STATE, which the
# lifecycle already tracks — a `done` tag can only ever disagree with a closed
# ticket, and `wontfix` is a decision the thread records with an author and a
# date. `discussion` described every ticket that had a thread. None of the five
# had ever been applied to anything, which is the measurement that settled it.
