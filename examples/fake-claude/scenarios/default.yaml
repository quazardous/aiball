# Default scenario — joué quand `fake-claude` est appelé sans arg.
# REPL minimal : boot + boucle [prompt → echo → flux lorem ipsum → prompt].
# La frappe vit dans le widget Input (en bas), le flux sort dans le widget
# RichLog (au milieu) — chacun sa région, pas de parasitage curseur/refresh.
# Ctrl+Q ou Ctrl+C pour quitter (binding textual standard).
meta:
  name: default
  describes: "REPL inputtable — boot + loop [main.idle echo → main.streaming_output]"
  expects_input: true
steps:
  - screen: boot.loading
  - loop:
      - screen: main.idle
      - screen: main.streaming_output
