[package]
name = "cl-pty-proxy"
# #768 Phase 2 — cross-platform proxy (Windows + Linux): ConPTY + loopback
# ws on Windows, openpty + UDS on Linux. The only claude-loop proxy (#3043).
version = "0.1.0"
edition = "2021"
description = "claude-loop unified PTY proxy — live human-typing detection + ws-over-loopback/UDS wake injection (Windows ConPTY + Linux openpty)"
license = "MIT"

[[bin]]
name = "cl-pty-proxy"
path = "src/main.rs"

[[bin]]
# #3066 — the session host: one session in a PTY, served to clients on
# attach.sock (docs/LOOP-HOST.md) and driven by the daemon on control.sock
# (docs/SESSION-HOST.md). Replaces tmux + the per-loop proxy.
name = "cl-session-host"
path = "src/session_host.rs"

[[bin]]
name = "fake-claude-log"
path = "src/bin/fake-claude-log.rs"

[dependencies]
# ConPTY allocation + child spawn + master reader/writer + resize. Same
# crate family psmux is built on (it vendors portable-pty-psmux); we use
# upstream here to stay self-contained.
portable-pty = "0.9"
# argv[0] PATH/PATHEXT resolution (claude.exe / claude.cmd).
which = "6"
# #768 — loop.sock ws client (emit proxyEvents, receive inject/view frames).
# ws:// only (loopback transport #739) → no TLS feature, just the handshake.
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
serde_json = "1"
# #3048 — a screen model of what claude draws (text, cursor, geometry), to
# answer `getScreen` on loop.sock; compared to tmux's capture-pane first.
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

# #768 Phase 2 — Unix deps : termios for raw mode, libc for openpty/ioctl,
# nix for safe abstraction (vs raw libc). Activated only on Unix targets.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["term", "fs", "ioctl"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
