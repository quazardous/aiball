[package]
name = "cl-pty-proxy"
version = "0.1.0"
edition = "2021"
description = "claude-loop ConPTY proxy for Windows — live human-typing detection + socket wake injection (strategy B, #281)"
license = "MIT"

[[bin]]
name = "cl-pty-proxy"
path = "src/main.rs"

[dependencies]
# ConPTY allocation + child spawn + master reader/writer + resize. Same
# crate family psmux is built on (it vendors portable-pty-psmux); we use
# upstream here to stay self-contained.
portable-pty = "0.9"
# argv[0] PATH/PATHEXT resolution (claude.exe / claude.cmd).
which = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
