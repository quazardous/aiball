# Component inventory for aiball — driven by qcmp (Quick Components).
# See packages/components/README.md.
project: aiball

components:
  - key: aiball
    name: Aiball BAL
    file: package.json
    path: version
    extractor: json
    main: true

  - key: frontend
    name: Aiball Web UI
    file: frontend/package.json
    path: version
    extractor: json

  # claude-loop ships with aiball (same repo, no own package.json) —
  # version tracks the main aiball release. See bin/claude-loop +
  # src/claude-loop/. Doc: docs/CLAUDE-LOOP.md.
  - key: claude-loop
    name: Claude Loop wrapper
    file: package.json
    path: version
    extractor: json
