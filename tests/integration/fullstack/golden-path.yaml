# #985 — golden path full-stack : a ticket @mentioning the loop's consumer
# seeds an unread ping ; the loop boots, wakes on it, and on wake delivery
# marks it seen → the daemon's unread for test-agent drops to 0. Exercises the
# whole chain : daemon ping → loop poll → wake → inject → seen-ack → daemon.
scenario: golden-path-wake
fixture: mention-unread
steps:
  - { at: 0, spawn: { fake_claude: quick-prompt } }
# The first wake cannot come before ~50 s: boot seals at its 30 s minimum, the
# session goes live ~10 s later, and the bootstrap skill it injects defers the
# next wake by ~10 s. 90 s leaves room for the wake, its delivery and the ack.
  - { at: 90, expect: { daemon: { "unread.test-agent": 0 } } }
