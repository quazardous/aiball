# #734 V3 Phase A + B — user stories for the AFK + human-typing fields of
# the in-memory IpcState (`ipc-state.ts`).
#
# #840 `4z59jt` — david "vire tout marker fichier". `readLoopStateInput`
# est strictement IPC. Plus de fallback fichier. Quand `ipcAfkMode` est
# null, le read retourne `off` (= safe default). Les fichiers présents
# côté disque sont ignorés.
scenario: afk-ipc-state
description: |
  IpcState `afkMode` / `afkExpiryMs` (Phase A) and `humanTypingAtMs`
  (Phase B) are the sole source of truth for the AFK + typing signals
  consumed by `readLoopStateInput`. Aucun fallback fichier.

unit:
  - name: "Phase A — ipcAfk=null → off (safe default, file ignored)"
    call: { module: "./yaml-scenarios-helpers.js", fn: "readLoopStateWithIpc" }
    args:
      - sd: "TMPDIR"
        files:
          "afk": "inf"     # le fichier traîne sur disque mais on l'ignore
        ipc:
          bootComplete: true
          idleSinceMs: 1748534400000
    expect:
      "afkMode": "off"

  - name: "Phase A — ipcAfk wait_10m"
    call: { module: "./yaml-scenarios-helpers.js", fn: "readLoopStateWithIpc" }
    args:
      - sd: "TMPDIR"
        ipc:
          bootComplete: true
          idleSinceMs: 1748534400000
          afkMode: "wait_10m"
          afkExpiryMs: 1748535000000
    expect:
      "afkMode": "wait_10m"
      "afkExpiryMs": 1748535000000

  - name: "Phase A — ipcAfk off overrides a stale AFK file"
    call: { module: "./yaml-scenarios-helpers.js", fn: "readLoopStateWithIpc" }
    args:
      - sd: "TMPDIR"
        files:
          "afk": "inf"     # stale on-disk hold the agent should NOT see
        ipc:
          bootComplete: true
          idleSinceMs: 1748534400000
          afkMode: "off"   # explicit "AFK is off" event from the dispatcher
          afkExpiryMs: null
    expect:
      "afkMode": "off"

  - name: "Phase B — ipcHumanTypingAtMs is the sole signal"
    call: { module: "./yaml-scenarios-helpers.js", fn: "readLoopStateWithIpc" }
    args:
      - sd: "TMPDIR"
        files:
          "human-typing": "BOOT_ISO"   # fichier ignoré, l'IPC tranche
        ipc:
          bootComplete: true
          idleSinceMs: 1748534400000
          humanTypingAtMs: 1748534400000
    expect:
      "humanTypingAtMs": 1748534400000

