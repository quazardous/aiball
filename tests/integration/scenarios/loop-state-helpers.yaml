# #750 Slice 2 — migration `loop-state.test.ts` (helper-fn half).
# Boolean-returning pure helpers that consume the same LoopStateInput
# fixture as `computeLoopView`. Uses `args_template` so each entry only
# spells out its overrides. Per-entry `call.fn` switches between the
# helpers : `canPaintStopOnTyping`, `canFlipBgFromBoot`. (#2311 — the
# typing-arm helper is gone: typing arms the hold during boot too, #951.)
# The remaining helpers (`canFireWake`,
# `isAfkHeld`, `isAutonomous`, `isBootPhase`) take a VIEW (= result of
# computeLoopView) — not yaml-fit without chained calls. Stay in TS.
# `shouldArmAfk10mOnSettleBoot({noWait})` also stays — different fixture
# shape, lone 2-case test, not worth a separate scenario.
scenario: loop-state-helpers
description: |
  Pure boolean helpers consumed by the timer's branching logic :
  `canPaintStopOnTyping` (post-boot `stop` bar word) and `canFlipBgFromBoot`
  (boot → yellow bar background flip). Both share the same boot-
  grace gate semantics + post-boot signal precedence — pin the
  cross-product so a refactor touching the gate doesn't drift one.

# Same fixture as loop-state-compute.yaml — T0 = 1780245600000.
args_template:
    nowMs: 1780245600000
    loopStartMs: 1780245600000
    bootGraceMs: 60000
    bootMinMs: 30000
    bootDeadlineMs: 1780245630000
    resumePickerActive: false
    bootComplete: true
    paneBusy: false
    paneReady: true
    paneCompacting: false
    paneInterrupted: false
    noWait: false
    humanTypingAtMs: null
    humanTypingTtlMs: 5000
    afkMode: "off"
    afkExpiryMs: null
    idleSinceMs: null
    wakeInFlightAtMs: null
    wakeInFlightTtlMs: 2000
    busyDeferUntilMs: null
    inputHotTtlMs: 3000
    manualWake: false

unit:
    # --- canPaintStopOnTyping ---
    - name: "canPaintStopOnTyping : false in boot-grace"
      call: { module: "./loop-state.js", fn: "canPaintStopOnTyping" }
      args_overrides:
        nowMs: 1780245605000  # T0+5s
        bootComplete: false
        paneReady: false
      expect_value: false

    - name: "canPaintStopOnTyping : true post-floor with bootComplete sealed"
      call: { module: "./loop-state.js", fn: "canPaintStopOnTyping" }
      args_overrides:
        nowMs: 1780245690000  # T0+90s (past 30s floor)
        bootComplete: true
      expect_value: true

    # --- canFlipBgFromBoot ---
    - name: "canFlipBgFromBoot : false in boot-grace"
      call: { module: "./loop-state.js", fn: "canFlipBgFromBoot" }
      args_overrides:
        nowMs: 1780245605000
        bootComplete: false
        paneReady: false
      expect_value: false

    - name: "canFlipBgFromBoot : true post-floor with bootComplete sealed"
      call: { module: "./loop-state.js", fn: "canFlipBgFromBoot" }
      args_overrides:
        nowMs: 1780245690000
        bootComplete: true
      expect_value: true
