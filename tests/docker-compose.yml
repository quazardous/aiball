# #324 — e2e test stack. Run from the repo root:
#   docker compose -f tests/docker-compose.yml up --build
#
# The `daemon` service runs the REAL aiball (createApp) in an isolated
# container; `agent-sim` containers (added next) drive it through the business
# API. Everything test-specific is injected via env + volumes — zero changes to
# production code (#fryynv). The test env (NODE_ENV=test) frames test mode; a
# fresh ephemeral DB volume keeps it separate from dev.
services:
  daemon:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    environment:
      NODE_ENV: test
      AIBALL_HOME: /data          # isolated, ephemeral DB (volume below)
      AIBALL_HOST: 0.0.0.0
      AIBALL_PORT: "7777"
      AIBALL_SOCK: ""             # no UDS in-container → bearer-token auth only
    volumes:
      - ..:/app                   # live source (createApp, routes, …)
      - /app/node_modules         # preserve the image's native node_modules
      - aiball-test-data:/data    # ephemeral test DB, separate from dev
    ports:
      # #982 — host port configurable to dodge collisions with other projects
      # (e.g. skybot-runic also publishes 17777). Override: AIBALL_TEST_PORT=… .
      - "${AIBALL_TEST_PORT:-17777}:7777"
    healthcheck:
      # /api/health is a PUBLIC path (no auth) — good liveness probe.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  # #981 Slice 1 — the AGENT : the REAL claude-loop stack (loop.ts + PTY proxy +
  # hooks) driving fake-claude (the only faked component), pointed at `daemon`
  # over HTTP. The full-stack scenario harness drives this service. fake-claude
  # plays a predictable scenario ; human input (timeline 2) lands via tmux
  # send-keys into its pane (proxy = human keystroke) ; daemon data (timeline 3)
  # is seeded over the API. Headless tmux = naturally detached (covers #971).
  agent:
    build:
      context: ..
      dockerfile: tests/Dockerfile.agent
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      AIBALL_URL: http://daemon:7777   # data-plane remote (REMOTE.md Direct)
      AIBALL_HOME: /agent-state         # loop's own state (NOT the daemon DB)
      AIBALL_SOCK: ""                   # force HTTP path, no local UDS
      AGENT_CONSUMER: ${AGENT_CONSUMER:-test-agent}
      AGENT_PROJECT: ${AGENT_PROJECT:-bidon}   # the throwaway cloistered project
      # #984 — overridable per scenario by the full-stack orchestrator
      # (run_fullstack.py exports AGENT_SCENARIO from the scenario's
      # spawn.fake_claude). examples/fake-claude/scenarios/<x>.yaml.
      AGENT_SCENARIO: ${AGENT_SCENARIO:-quick-prompt}
      AGENT_NAME: ${AGENT_NAME:-agent1}
      # Bump to `debug` to trace the loop's pane probe / bootMachine / compacting
      # lifecycle when diagnosing a scenario. Defaults to `info` (no-op).
      CL_LOG_LEVEL: ${CL_LOG_LEVEL:-info}
      TERM: xterm-256color
    volumes:
      - ..:/app                        # live source
      - /app/node_modules              # preserve the image's native node_modules
      - aiball-test-data:/data         # shared DB — bootstrap token mint ONLY
      - agent-state:/agent-state       # ephemeral loop state
    healthcheck:
      test: ["CMD", "bash", "-lc", "/app/bin/claude-loop inspect agent1 | grep -q '\"exists\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aiball-test-data:
  agent-state:
