# #324 — e2e test stack. Run from the repo root:
#   docker compose -f tests/docker-compose.yml up --build
#
# The `daemon` service runs the REAL aiball (createApp) in an isolated
# container; `agent-sim` containers (added next) drive it through the business
# API. Everything test-specific is injected via env + volumes — zero changes to
# production code (#fryynv). The test env (NODE_ENV=test) frames test mode; a
# fresh ephemeral DB volume keeps it separate from dev.
#
# Everything here runs OFF the live host's budget: each service is capped at
# AIBALL_TEST_CPUS (default 4), so a test run never starves the live daemon and
# loops sharing the machine. `bash tests/run-docker.sh` is the entry point.
services:
  # The unit suite (`npm test`), in the same image as the daemon. No network at
  # all (loopback only): nothing a test does can reach the live daemon, a remote
  # or the internet. The source is mounted READ-ONLY; AIBALL_TEST_SRC points it
  # at another checkout (e.g. a scratch copy of an undeployed change).
  tests:
    profiles: ["tests"]
    build:
      context: ..
      dockerfile: tests/Dockerfile
    cpus: ${AIBALL_TEST_CPUS:-4}
    network_mode: none
    environment:
      NODE_ENV: test
      AIBALL_HOME: /tmp/aiball-unit
      AIBALL_SOCK: ""
      # #3240 — this image builds cl-session-host: a suite that needs it fails
      # when it is missing, instead of passing on tests it skipped.
      AIBALL_TEST_REQUIRE_HOST: "1"
    volumes:
      - ${AIBALL_TEST_SRC:-..}:/app:ro
      - /app/node_modules
      - /app/frontend/node_modules
    command: ["npm", "test"]

  # #3240 — the frontend's own checks, as CI's frontend-build job runs them: an
  # install of the frontend's dependencies ALONE. The root node_modules is
  # masked by an empty volume, so an import that reaches the backend fails here
  # as it does in CI, instead of being resolved by the root's packages. The
  # build writes to /tmp: the source stays read-only.
  frontend:
    profiles: ["tests"]
    build:
      context: ..
      dockerfile: tests/Dockerfile.frontend
    cpus: ${AIBALL_TEST_CPUS:-4}
    network_mode: none
    working_dir: /app/frontend
    volumes:
      - ${AIBALL_TEST_SRC:-..}:/app:ro
      - /app/node_modules
      - /app/frontend/node_modules
    # Vite writes a temporary file next to its config, so the build runs on a
    # copy under /tmp: src/ (the @shared alias), frontend/ and package.json, and
    # no root node_modules, as in CI.
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/w && cd /app
        && tar --exclude=frontend/node_modules --exclude=frontend/dist -cf - package.json src frontend | tar -xf - -C /tmp/w
        && ln -s /app/frontend/node_modules /tmp/w/frontend/node_modules
        && cd /tmp/w/frontend && npx vue-tsc --noEmit && npx vite build --outDir /tmp/frontend-dist --emptyOutDir

  daemon:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    cpus: ${AIBALL_TEST_CPUS:-4}
    environment:
      NODE_ENV: test
      AIBALL_HOME: /data          # isolated, ephemeral DB (volume below)
      AIBALL_HOST: 0.0.0.0
      AIBALL_PORT: "7777"
      AIBALL_SOCK: ""             # no UDS in-container → bearer-token auth only
    volumes:
      # The source under test: this checkout, or AIBALL_TEST_SRC (a scratch copy of
      # an undeployed change) — the same override the unit service honours.
      - ${AIBALL_TEST_SRC:-..}:/app
      - /app/node_modules         # preserve the image's native node_modules
      - aiball-test-data:/data    # ephemeral test DB, separate from dev
    ports:
      # #982 — host port configurable to dodge collisions with other projects
      # (e.g. skybot-runic also publishes 17777). Override: AIBALL_TEST_PORT=… .
      # Loopback only: the test daemon carries throwaway logins (and the board
      # simulator can load a copy of real threads), never a thing for the LAN.
      - "127.0.0.1:${AIBALL_TEST_PORT:-17777}:7777"
    healthcheck:
      # /api/health is a PUBLIC path (no auth) — good liveness probe.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  # #981 Slice 1 — the AGENT : the REAL claude-loop stack (loop.ts + PTY proxy +
  # hooks) driving fake-claude (the only faked component), pointed at `daemon`
  # over HTTP. The full-stack scenario harness drives this service. fake-claude
  # plays a predictable scenario ; human input (timeline 2) lands via tmux
  # send-keys into its pane (proxy = human keystroke) ; daemon data (timeline 3)
  # is seeded over the API. Headless tmux = naturally detached (covers #971).
  agent:
    build:
      context: ..
      dockerfile: tests/Dockerfile.agent
    cpus: ${AIBALL_TEST_CPUS:-4}
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      AIBALL_URL: http://daemon:7777   # data-plane remote (REMOTE.md Direct)
      AIBALL_HOME: /agent-state         # loop's own state (NOT the daemon DB)
      AIBALL_SOCK: ""                   # force HTTP path, no local UDS
      AGENT_CONSUMER: ${AGENT_CONSUMER:-test-agent}
      AGENT_PROJECT: ${AGENT_PROJECT:-bidon}   # the throwaway cloistered project
      # #984 — overridable per scenario by the full-stack orchestrator
      # (run_fullstack.py exports AGENT_SCENARIO from the scenario's
      # spawn.fake_claude). examples/fake-claude/scenarios/<x>.yaml.
      AGENT_SCENARIO: ${AGENT_SCENARIO:-quick-prompt}
      AGENT_NAME: ${AGENT_NAME:-agent1}
      # #3066 — 1: the loop on a session host, with its own daemon in this container.
      AGENT_HOST: ${AGENT_HOST:-}
      # Bump to `debug` to trace the loop's pane probe / bootMachine / compacting
      # lifecycle when diagnosing a scenario. Defaults to `info` (no-op).
      CL_LOG_LEVEL: ${CL_LOG_LEVEL:-info}
      TERM: xterm-256color
    volumes:
      - ..:/app                        # live source
      - /app/node_modules              # preserve the image's native node_modules
      - aiball-test-data:/data         # shared DB — bootstrap token mint ONLY
      - agent-state:/agent-state       # ephemeral loop state
    healthcheck:
      test: ["CMD", "bash", "-lc", "/app/bin/claude-loop inspect agent1 | grep -q '\"exists\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aiball-test-data:
  agent-state:
