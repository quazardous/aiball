name: the moderator accepts a plan the agent has already replaced
# Case 4, decided: only the latest decision of a thread can be accepted or
# rejected. Accepting the superseded plan is refused (409, with its reason), so
# the agent never receives an execute for a plan nobody works on any more; the
# fresher plan still decides normally.
steps:
  - alpha-lead: ticket_new
    args: { title: Accepting a superseded plan, body: Two plans in a row; the moderator accepts the first. }
    save: { ticket: id }
  - moderator: approve $ticket
  - alpha-lead: ticket_claim
    args: { ticket_id: $ticket }
  - alpha-lead: ticket_reply
    args: { target_id: $ticket, body: Plan one., summary_until: Plan one waiting for the moderator., then: plan }
    save: { first: id }
  - alpha-lead: ticket_reply
    args: { target_id: $ticket, body: Plan two; it replaces plan one., summary_until: Plan two waiting for the moderator., then: plan }
    save: { second: id }
  - wake: alpha-lead
  - expect:
      alpha-lead: { ticket: $ticket, act: false, gated: true }
  # Refused: the reason is the fresher plan.
  - moderator: accept $first
    may_fail: true
  - expect:
      alpha-lead: { ticket: $ticket, act: false, gated: true, events: [] }
  # The latest one decides, and hands the ticket back to its author.
  - moderator: accept $second
  - expect:
      alpha-lead: { ticket: $ticket, act: true, gated: false }
