name: two accepted plans in flight, and another owner claims the one the lead still holds
# Case 14, decided: a claim is a weak assign, PROTECTED while its holder works
# (#2379, david). alpha-lead holds A (plan accepted, a step posted), then claims
# B to execute B's accepted plan. Claiming B does not release A: the lead holds
# both, and A stays out of the other owner's backlog. The other owner claiming A
# by id is now REFUSED while the protection stands, and A stays the lead's.
cohort: tests/sim/cohorts/two-owners.yaml
steps:
  - alpha-lead: ticket_new
    args: { title: Ticket A, body: First accepted plan. }
    save: { a: id }
  - alpha-lead: ticket_new
    args: { title: Ticket B, body: Second accepted plan. }
    save: { b: id }
  - moderator: approve $a
  - moderator: approve $b
  - alpha-lead: ticket_claim
    args: { ticket_id: $a }
  - alpha-lead: ticket_reply
    args: { target_id: $a, body: Plan for A., summary_until: Plan for A waiting., then: plan }
    save: { plan_a: id }
  - moderator: accept $plan_a
  - alpha-lead: ticket_reply
    args: { target_id: $a, body: A's first step done., summary_until: A in progress with the lead., then: continue }
  - alpha-lead: ticket_reply
    args: { target_id: $b, body: Plan for B., summary_until: Plan for B waiting., then: plan }
    save: { plan_b: id }
  - moderator: accept $plan_b
  - alpha-lead: ticket_claim
    args: { ticket_id: $b }
  # Both claims hold: A is still the lead's, and not the other owner's.
  - expect:
      alpha-lead: { ticket: $a, act: true, claim: true }
      alpha-second: { ticket: $a, backlog: none, act: false, claim: false }
  - expect:
      alpha-lead: { ticket: $b, act: true, claim: true }
  # The other owner tries to take A: refused, the lead is working on it.
  - alpha-second: ticket_claim
    args: { ticket_id: $a }
    refused: is held by alpha-lead
  - view: [alpha-lead, alpha-second]
  - expect:
      alpha-lead: { ticket: $a, act: true, claim: true }
      alpha-second: { ticket: $a, backlog: none, act: false, claim: false }
