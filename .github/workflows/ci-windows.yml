name: CI (Windows)

# Windows TS coverage. The Rust ConPTY proxy has its own workflow
# (cl-pty-proxy-build.yml, cargo build+test on windows-latest). This lane
# covers the TypeScript side on Windows: typecheck (cheap, catches
# win32-relevant type breakage) + the win32-safe tests.
#
# Test execution on Windows is still curated, NOT wholesale: parts of the
# suite assume Unix (tmux, fake-claude integration). The `test` job below
# runs the files known to pass on win32 — currently the ipc-events transport
# layer (#739: loopback-TCP transport now binds + round-trips on win32) and
# its shared transport-contract. As more files are gated for win32, add them
# to the list. The full suite runs on the Linux lane (ci.yml).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      # The smoke job installs the tarball, so what the tarball CONTAINS is
      # part of this lane's surface: the entrypoints, the packed frontend, and
      # the `files`/`bin` fields themselves.
      - 'bin/**'
      - 'frontend/**'
      - 'install.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      # The smoke job installs the tarball, so what the tarball CONTAINS is
      # part of this lane's surface: the entrypoints, the packed frontend, and
      # the `files`/`bin` fields themselves.
      - 'bin/**'
      - 'frontend/**'
      - 'install.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/ci-windows.yml'

jobs:
  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Curated win32-safe tests (see header). The ipc-events transport
      # layer (#739) is the headline coverage — it now binds + round-trips
      # on win32 via loopback TCP. UDS-specific cases self-skip on win32.
      # install.test.ts pins the generated systemd unit AND the generated
      # scheduled-task launchers (#1571); both render platform-independently,
      # so this lane is where the Windows half is actually asserted.
      # cursor-args + prompt-input-watcher guard a bug that only bit on
      # Windows (psmux ignoring `display-message -F`, so the cursor read as
      # null and greyed ghost-suggestions passed for real input) — the guard
      # belongs on the platform where it broke. Both are pure functions, no
      # mux spawned.
      - run: node --import tsx --test "src/claude-loop/ipc-events.test.ts" "src/claude-loop/transport/transport-contract.test.ts" "src/cli/install.test.ts" "src/sysdeps.test.ts" "src/cursor-args.test.ts" "src/claude-loop/pane-watchers/prompt-input-watcher.test.ts"

  # #1571 — the parity check that makes "aiball supports Windows" verifiable
  # instead of declared. Everything above runs from the checkout; this job runs
  # from the TARBALL, in a directory that has never seen the repo. It is the
  # only thing that would catch a `files` entry gone missing, and it runs on
  # every PR rather than once per tag, because a parity verified at tag time
  # drifts silently between tags (#1559 was exactly that).
  #
  # cl-pty-proxy is NOT built here (release.yml owns that). That is deliberate
  # extra coverage: `aiball check` must NAME the missing proxy and still exit
  # cleanly, rather than fall over.
  smoke-tarball:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # This job installs BOTH trees, so both locks key the cache.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      # `prepack` runs `npm --prefix frontend run build`, i.e. `vue-tsc && vite
      # build` — and the root `npm ci` does NOT populate frontend/node_modules.
      # Without this the pack dies on `'vue-tsc' is not recognized`, which is
      # not a packaging failure at all, just a missing install.
      - run: npm ci
        working-directory: frontend
      # `prepack` builds frontend/dist, which `files` ships.
      - name: npm pack
        shell: pwsh
        run: |
          $tgz = (npm pack --silent | Select-Object -Last 1)
          # A failed pack leaves $tgz null, and `.Trim()` on null reports
          # "cannot call a method on a null-valued expression" — which buries
          # the real error. Name it instead.
          if (-not $tgz) { throw "npm pack produced no tarball (see the prepack output above)" }
          "TARBALL=$(Resolve-Path $tgz.Trim())" >> $env:GITHUB_ENV
      - name: install the tarball into a virgin directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke" | Out-Null
          Set-Location "$env:RUNNER_TEMP\smoke"
          npm init -y | Out-Null
          npm install --no-audit --no-fund "$env:TARBALL"
      - name: aiball --version matches package.json
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\smoke"
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\package.json" | ConvertFrom-Json).version
          $got = (& ".\node_modules\.bin\aiball.cmd" --version).Trim()
          if ($got -ne $expected) { throw "aiball --version = '$got', expected '$expected'" }
          "aiball --version = $got"
      # `check` talks to a daemon that isn't running here, so a non-zero exit is
      # expected and not the signal. What we assert is that it RAN and produced
      # the prerequisite block in its current shape — the Windows names, not the
      # POSIX ones. A regression to tmux/python3 here means PREREQS lost its
      # platform split.
      - name: aiball check names the Windows prerequisites
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\smoke"
          $out = (& ".\node_modules\.bin\aiball.cmd" check 2>&1 | Out-String)
          # No daemon on this runner, so `check` exits non-zero by design. A
          # pwsh step ends with `exit $LASTEXITCODE`, which would turn that
          # expected exit into a red job — clear it and judge on the OUTPUT.
          $global:LASTEXITCODE = 0
          $out
          if ($out -notmatch 'dependencies') { throw "no dependencies block in `aiball check` output" }
          foreach ($p in 'psmux', 'bash', 'cargo') {
            if ($out -notmatch [regex]::Escape($p)) { throw "prerequisite '$p' missing from check output" }
          }
          foreach ($p in 'python3') {
            if ($out -match "(?m)^\s*[^\s]+\s$p\:") { throw "POSIX prerequisite '$p' leaked into the Windows list" }
          }
          # This runner has no psmux, which makes it the virgin machine the dev
          # boxes cannot simulate — so assert the DEGRADED path itself: a missing
          # required prerequisite is marked, named, and paired with the command
          # that fixes it, instead of the run falling over. (An earlier version
          # matched the string 'cl-pty-proxy', which only ever tested the wording
          # of a `powers` field and could not fail for the reason it claimed.)
          if ($out -notmatch '(?m)^\s*✗ psmux: MISSING') { throw "a missing required prerequisite is no longer reported as MISSING" }
          if ($out -notmatch '(?m)^\s*install with:.*psmux') { throw "a missing prerequisite no longer names the command that installs it" }
