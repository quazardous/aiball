name: CI (Windows)

# Windows TS coverage. The Rust ConPTY proxy has its own workflow
# (cl-pty-proxy-build.yml, cargo build+test on windows-latest). This lane
# covers the TypeScript side on Windows: typecheck (cheap, catches
# win32-relevant type breakage) + the win32-safe tests.
#
# Test execution on Windows is still curated, NOT wholesale: parts of the
# suite assume Unix (tmux, fake-claude integration). The `test` job below
# runs the files known to pass on win32 — currently the ipc-events transport
# layer (#739: loopback-TCP transport now binds + round-trips on win32) and
# its shared transport-contract. As more files are gated for win32, add them
# to the list. The full suite runs on the Linux lane (ci.yml).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/ci-windows.yml'

jobs:
  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Curated win32-safe tests (see header). The ipc-events transport
      # layer (#739) is the headline coverage — it now binds + round-trips
      # on win32 via loopback TCP. UDS-specific cases self-skip on win32.
      - run: node --import tsx --test "src/claude-loop/ipc-events.test.ts" "src/claude-loop/transport/transport-contract.test.ts"
