name: CI

# General CI for the TS codebase + frontend. The Windows ConPTY proxy (Rust)
# has its own workflow (cl-pty-proxy-build.yml); Windows TS coverage lives in
# ci-windows.yml. This is the Linux safety net that was missing — until now
# lint / typecheck / test / frontend-build ran nowhere, so lint-broken code and
# a missing runtime dep (`marked`) both merged to main unnoticed.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'welcome/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'welcome/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Cap au lieu du default 6h GH Actions : la suite a un test qui pend une
    # handle (root cause à diagnostiquer séparément). Fail fast vaut mieux que
    # bouffer 6h de CI par push.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # A few unit tests shell out to tmux (the Linux mux). Install it so they
      # don't fail on a bare runner.
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      # Clean env: the suite resolves the cwd .aiball.yaml, so a configured box
      # would flip the app into proxy mode and hit a real remote. A fresh CI
      # checkout has no .aiball.yaml, so local mode is the default here.
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `build` runs `vue-tsc --noEmit && vite build` — catches the frontend
      # typecheck + build breakage that today only surfaces when run by hand.
      - run: npm run build
        working-directory: frontend

  contrib-build:
    runs-on: ubuntu-latest
    # The tutorial demo (contrib/mini-admin) imports the UI kit by path from
    # frontend/. Building it here is what keeps docs/UI-KIT.md honest: a kit
    # change that breaks the tutorial fails CI instead of rotting in silence.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contrib/mini-admin/package-lock.json
      # The demo typechecks the kit files by path from frontend/src; their
      # `import ... from "vue"` resolves (TS-side) against frontend/node_modules,
      # not the demo's own — so the frontend deps must be installed too. (vite
      # build alone wouldn't need them; vue-tsc does.) This is also what keeps
      # the "kit change breaks the tutorial → CI red" guarantee honest.
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: contrib/mini-admin
      - run: npm run build
        working-directory: contrib/mini-admin
